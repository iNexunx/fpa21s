name: Compilar Overlays Multi-Android A21s (12 a 17)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-overlays:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - android_ver: "12"
            api_level: "31"
          - android_ver: "12L"
            api_level: "32"
          - android_ver: "13"
            api_level: "33"
          - android_ver: "14"
            api_level: "34"
          - android_ver: "15"
            api_level: "35"
          - android_ver: "16"
            api_level: "36"
          - android_ver: "17"
            api_level: "37"

    steps:
      - name: Instalar plataforma Android API ${{ matrix.api_level }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-${{ matrix.api_level }}" || true

      - name: Compilar Overlay Framework (android)
        run: |
          mkdir -p framework_build/res/values

          cat << 'EOF' > framework_build/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="me.phh.treble.overlay.samsung.a21s.fingerprint"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="${{ matrix.api_level }}" android:targetSdkVersion="${{ matrix.api_level }}" />
              <application android:hasCode="false" />
              <overlay android:targetPackage="android"
                       android:priority="10"
                       android:isStatic="true" />
          </manifest>
          EOF

          cat << 'EOF' > framework_build/res/values/config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_hasFingerprintSensor">true</bool>
              <integer name="config_fingerprintSensorType">1</integer>
              <bool name="config_useDevInputEventForFingerprint">false</bool>
              <string-array name="config_biometric_sensors" translatable="false">
                  <item>0:2:15</item>
              </string-array>
              <string-array name="config_fingerprintSensorLocations" translatable="false">
                  <item>540:700:80</item>
              </string-array>
          </resources>
          EOF

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          if [ -d "$ANDROID_HOME/platforms/android-${{ matrix.api_level }}" ]; then
            PLATFORM="$ANDROID_HOME/platforms/android-${{ matrix.api_level }}"
          else
            PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          fi

          $BUILD_TOOLS/aapt2 compile --dir framework_build/res -o framework_res.zip

          $BUILD_TOOLS/aapt2 link \
            -I "$PLATFORM/android.jar" \
            --min-sdk-version ${{ matrix.api_level }} \
            --target-sdk-version ${{ matrix.api_level }} \
            --manifest framework_build/AndroidManifest.xml \
            --auto-add-overlay \
            -o framework_unaligned.apk \
            framework_res.zip

          $BUILD_TOOLS/zipalign -v -p 4 framework_unaligned.apk framework_aligned.apk

          keytool -genkeypair -v -keystore test.keystore -storepass password -keypass password \
            -alias test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android,O=Android,C=US"

          FW_APK="treble-overlay-samsung-a21s-fingerprint-android${{ matrix.android_ver }}.apk"
          $BUILD_TOOLS/apksigner sign --ks test.keystore --ks-pass pass:password \
            --out "$FW_APK" framework_aligned.apk

      - name: Compilar Overlay Settings (com.android.settings)
        run: |
          mkdir -p settings_build/res/values

          cat << 'EOF' > settings_build/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="me.phh.treble.overlay.samsung.a21s.fingerprint.settings"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="${{ matrix.api_level }}" android:targetSdkVersion="${{ matrix.api_level }}" />
              <application android:hasCode="false" />
              <overlay android:targetPackage="com.android.settings"
                       android:priority="10"
                       android:isStatic="true" />
          </manifest>
          EOF

          cat << 'EOF' > settings_build/res/values/config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_show_fingerprint_settings">true</bool>
          </resources>
          EOF

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          if [ -d "$ANDROID_HOME/platforms/android-${{ matrix.api_level }}" ]; then
            PLATFORM="$ANDROID_HOME/platforms/android-${{ matrix.api_level }}"
          else
            PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          fi

          $BUILD_TOOLS/aapt2 compile --dir settings_build/res -o settings_res.zip

          $BUILD_TOOLS/aapt2 link \
            -I "$PLATFORM/android.jar" \
            --min-sdk-version ${{ matrix.api_level }} \
            --target-sdk-version ${{ matrix.api_level }} \
            --manifest settings_build/AndroidManifest.xml \
            --auto-add-overlay \
            -o settings_unaligned.apk \
            settings_res.zip

          $BUILD_TOOLS/zipalign -v -p 4 settings_unaligned.apk settings_aligned.apk

          SETTINGS_APK="treble-overlay-samsung-a21s-fingerprint-settings-android${{ matrix.android_ver }}.apk"
          $BUILD_TOOLS/apksigner sign --ks test.keystore --ks-pass pass:password \
            --out "$SETTINGS_APK" settings_aligned.apk

      - name: Subir APKs compilados
        uses: actions/upload-artifact@v4
        with:
          name: overlays-android-${{ matrix.android_ver }}
          path: |
            treble-overlay-samsung-a21s-fingerprint-android${{ matrix.android_ver }}.apk
            treble-overlay-samsung-a21s-fingerprint-settings-android${{ matrix.android_ver }}.apk
